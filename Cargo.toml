[package]
name = "kino"
version = "0.1.0"
edition = "2024"

[dependencies]
alphanumeric-sort = "1.5"

bytes = "1"

chrono = { version = "0.4", features = ["std", "now"]}

fancy-regex = "0.16"

glib = "0.20" # gobject traits and error type
gstreamer = "0.23"
gstreamer-app = "0.23" # appsink
gstreamer-base = "0.23" # basesrc
gstreamer-pbutils = "0.23"
gstreamer-video = "0.23"

iced = { git = "https://github.com/iced-rs/iced", rev = "cfd06b4", features = ["image", "svg", "hot", "tokio", "advanced", "wgpu", "markdown"] }
iced_video_player = { git = "https://github.com/EmmanuelDodoo/iced_video_player" }
# iced_video_player = { path = "../ivp_fork" }

image = "0.25"

rand = "0.8"
reqwest = {version = "0.12", features = ["json"]}
# regex = "1.12"
rfd = "0.16"
rusqlite = {version = "0.37", features = ["bundled", "uuid", "chrono"]}

serde = { version = "1.0", features = ["derive"]}

tokio = {version = "1.47", features = ["fs"]}

url = "2"
uuid = {version = "1.18", features = ["v7", "std"]}
