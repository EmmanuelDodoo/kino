[package]
name = "kino"
version.workspace = true
edition.workspace = true

[workspace]
members = ["core/", "devutils/", "registry/", "widgets/"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
alphanumeric-sort = "1.5"
chrono = { version = "0.4", features = ["now", "std"] }
core = { path = "core/", version = "0.1.0" }
devutils = { path = "devutils/", version = "0.1.0" }
fancy-regex = "0.16"
glib = "0.20"  # gobject traits and error type
gstreamer = "0.23"
iced = { git = "https://github.com/iced-rs/iced", rev = "4f02d83", features = [
  "advanced",
  "highlighter",
  "hot",
  "image",
  "markdown",
  "svg",
  "tokio",
  "wgpu"
] }
image = "0.25"
rand = "0.8"
registry = { path = "registry/", version = "0.1.0" }
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.37", features = ["bundled", "chrono", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.47", features = ["fs"] }
tracing = "0.1"
url = "2"
widgets = { path = "widgets/", version = "0.1.0" }

[workspace.lints]
clippy.print_stderr = "deny"
clippy.print_stdout = "deny"

[dependencies]
alphanumeric-sort.workspace = true
bytes = "1"
chrono.workspace = true
core.workspace = true
devutils.workspace = true
directories = "6"
fancy-regex.workspace = true
html-escape = "0.2"
humantime = "2.3"
iced.workspace = true
iced_video_player = { git = "https://github.com/EmmanuelDodoo/iced_video_player" }
image.workspace = true
# iced_video_player = { path = "../ivp_fork" }
keepawake = "0.6.0"
open = "5.3.3"
rand.workspace = true
registry.workspace = true
reqwest.workspace = true
rfd = "0.16"
rusqlite.workspace = true
serde.workspace = true
smol_str = { version = "0.2", features = ["serde"] }
tokio.workspace = true
toml = { version = "0.9" }
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url.workspace = true
widgets.workspace = true

[profile.release]
lto = "thin"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
