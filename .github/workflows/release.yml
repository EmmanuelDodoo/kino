name: Package & Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - id: version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[0].version')

          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME#v}"

            if [[ "$TAG" != "$version" ]]; then
              echo "Tag version ($TAG) does not match Cargo.toml version ($version)"
              exit 1
            fi
          fi

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Gstreamer
        shell: pwsh
        run: ./resources/packaging/windows/install-gst.ps1

      - name: Build Kino
        run: cargo build --release

      - name: Bundle Gstreamer
        shell: bash
        run: ./resources/packaging/windows/assemble.sh

      - name: Install Velopack
        run: dotnet tool install -g vpk

      - name: Package
        shell: pwsh
        run: |
          vpk pack `
          --packId Kino `
          --packVersion "${{ needs.version.outputs.version }}" `
          --packDir dist/windows `
          --icon resources/logo/logo.ico `
          --outputDir release `
          --mainExe kino.exe

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v7
        with:
          name: Kino-${{ needs.version.outputs.version }}-Windows-Setup.exe
          path: release/Kino-win-Setup.exe
          if-no-files-found: error

      - name: Upload Windows Zip
        uses: actions/upload-artifact@v7
        with:
          name: Kino-${{ needs.version.outputs.version }}-Windows.zip
          path: release/Kino-win-Portable.zip
          if-no-files-found: error

  flatpak:
    needs: version
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps: 
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install system deps
        run: |
          python3 -m pip install -r resources/packaging/flatpak/cargo-sources-requirements.txt

      - name: Generating cargo sources
        run: |
          python3 resources/packaging/flatpak/flatpak-cargo-generator.py \
          Cargo.lock -o resources/packaging/flatpak/cargo-sources.yml

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Kino.flatpak
          upload-artifact: false
          manifest-path: resources/packaging/flatpak/io.github.EmmanuelDodoo.Kino.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak package
        uses: actions/upload-artifact@v7
        with:
          name: Kino-${{ needs.version.outputs.version }}.flatpak
          path: Kino.flatpak
          if-no-files-found: error

  deb:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build deb package
        run: cargo deb

      - name: Upload deb package
        uses: actions/upload-artifact@v7
        with:
          name: Kino-${{ needs.version.outputs.version }}.deb
          path: target/debian/*.deb
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs:
      - version
      - deb
      - windows
      - flatpak
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with: 
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.flatpak
            artifacts/**/*.exe
            artifacts/**/*.zip
